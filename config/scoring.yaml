# ============================================================
# PEAdvisor — Paramétrage du score propriétaire (sur 100)
# Les pondérations sont librement modifiables ; elles sont
# renormalisées automatiquement si leur somme diffère de 100
# ou si certaines données sont absentes pour un actif.
# ============================================================

ponderations:
  potentiel: 25      # écart entre objectif de cours et cours actuel
  valorisation: 15   # PER (plus il est bas, meilleure est la note)
  croissance: 15     # croissance estimée des résultats / du CA
  esg: 15            # score ESG (0-100)
  dividende: 10      # rendement du dividende
  volatilite: 10     # volatilité annualisée (plus elle est basse, meilleure est la note)
  consensus: 10      # consensus analystes (1 = vente forte, 5 = achat fort)

# Bornes de normalisation : chaque indicateur brut est projeté sur 0-100
# entre [min, max]. Valeurs au-delà des bornes : note plancher/plafond.
bornes:
  potentiel:    { min: -20.0, max: 50.0 }   # en %
  per:          { min: 5.0,   max: 40.0 }   # note inversée
  croissance:   { min: -10.0, max: 30.0 }   # en %
  dividende:    { min: 0.0,   max: 8.0 }    # rendement en %
  volatilite:   { min: 5.0,   max: 40.0 }   # en %, note inversée
  consensus:    { min: 1.0,   max: 5.0 }

# Note attribuée quand la donnée est manquante (neutre par défaut).
note_donnee_manquante: 50
