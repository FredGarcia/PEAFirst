name: Collecte quotidienne des données de marché

# La collecte est étalée dans le temps parce que le quota gratuit EODHD est de
# 20 requêtes par jour : impossible d'enrichir les 6 188 instruments d'un coup.
# Chaque exécution reprend là où la précédente s'est arrêtée grâce au cache
# data/marche_cache.json, qui est versionné pour survivre d'un run à l'autre.

on:
  schedule:
    # 06h15 UTC, après la clôture de la veille sur Euronext.
    - cron: '15 6 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Traitement à lancer'
        required: false
        default: historique
        type: choice
        options: [historique, cours, openfigi]
      source:
        description: 'Fournisseur pour le mode historique'
        required: false
        default: eodhd
        type: choice
        options: [eodhd, marketstack]
      filtre:
        description: 'Univers ciblé (ignoré si des ISIN sont fournis)'
        required: false
        default: pea
        type: choice
        options: [pea, actions, etf, tout]
      limite:
        description: "Nombre d'instruments (EODHD : 20/jour, Marketstack : 100/mois)"
        required: false
        default: '18'
      isins:
        description: "Lot précis d'ISIN séparés par des virgules (prioritaire sur le filtre)"
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  # Deux collectes simultanées se marcheraient sur les pieds en écrivant le
  # même cache et provoqueraient un conflit au commit.
  group: collecte-marche
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Vérifier la présence de la clé requise
        env:
          MODE: ${{ inputs.mode || 'historique' }}
          SOURCE: ${{ inputs.source || 'eodhd' }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: |
          # Chaque mode dépend d'un secret différent : mieux vaut s'arrêter ici
          # avec un message clair que d'échouer au milieu de la collecte.
          case "$MODE" in
            openfigi) requis=OPENFIGI_API_KEY ;;
            cours)    requis=MARKETSTACK_API_KEY ;;
            *)        if [ "$SOURCE" = "marketstack" ]; then
                        requis=MARKETSTACK_API_KEY
                      else
                        requis=EODHD_API_KEY
                      fi ;;
          esac
          if [ -z "${!requis}" ]; then
            echo "::error::Secret $requis absent, requis pour le mode « $MODE »."
            echo "::error::L'ajouter dans Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Mode « $MODE » : secret $requis présent."

      - name: Collecter les données
        env:
          MODE: ${{ inputs.mode || 'historique' }}
          SOURCE: ${{ inputs.source || 'eodhd' }}
          FILTRE: ${{ inputs.filtre || 'pea' }}
          LIMITE: ${{ inputs.limite || '18' }}
          ISINS: ${{ inputs.isins }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: |
          set -e
          if [ "$MODE" = "openfigi" ]; then
            python3 scripts/enrich_openfigi.py --tout
            python3 scripts/enrich_pea.py
            python3 scripts/enrich_pea_actions.py --resume
          else
            python3 scripts/enrich_marche.py --etat --filtre "$FILTRE"
            args="--filtre $FILTRE --limite $LIMITE"
            # Un lot explicite prime sur le filtre : c'est ce que produit la
            # sélection du tableau de bord.
            if [ -n "$ISINS" ]; then args="--isins $ISINS --limite $LIMITE"; fi
            if [ "$MODE" = "cours" ]; then
              python3 scripts/enrich_marche.py --cours $args
            else
              python3 scripts/enrich_marche.py --historique --source "$SOURCE" $args
            fi
          fi

      - name: Recalculer l'éligibilité et les scores
        run: |
          python3 scripts/enrich_pea_actions.py
          python3 scripts/scoring.py --top 10

      - name: Détecter les anomalies et enregistrer la progression
        run: |
          python3 scripts/anomalies.py --resume
          python3 scripts/historique.py

      - name: Régénérer le tableau de bord
        run: python3 scripts/dashboard.py --top 12

      - name: Contrôler l'intégrité de la base
        run: python3 scripts/validate_base.py

      - name: Publier les données collectées
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/marche_cache.json data/base_isin_marche.csv \
                  data/base_isin_scores.csv data/dashboard.html \
                  data/anomalies.csv data/historique_couverture.csv \
                  data/openfigi_cache.csv data/base_isin_figi.csv \
                  data/base_isin_fonds_pea.csv data/base_isin_actions_pea.csv \
                  data/corrections_pea.csv
          if git diff --cached --quiet; then
            echo "Aucune donnée nouvelle : rien à publier."
            exit 0
          fi
          notes=$(wc -l < data/base_isin_scores.csv)
          git commit -m "Collecte quotidienne : $((notes - 1)) instrument(s) notés"
          # Une autre exécution a pu publier entre-temps : on se rebase avant
          # de pousser plutôt que d'échouer.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
