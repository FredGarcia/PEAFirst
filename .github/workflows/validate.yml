name: Validation de la base ISIN

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  valider:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validation de la base
        run: python3 scripts/validate_base.py

      - name: Vérifier que le classement PEA est à jour
        run: |
          python3 scripts/enrich_pea.py
          if ! git diff --exit-code -- data/base_isin_fonds_pea.csv; then
            echo "::error::data/base_isin_fonds_pea.csv n'est pas à jour."
            echo "Relancer « python3 scripts/enrich_pea.py » et committer le résultat."
            exit 1
          fi

      - name: Re-valider après régénération
        run: python3 scripts/validate_base.py
